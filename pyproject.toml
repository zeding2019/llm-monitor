[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-monitor"
version = "0.1.0"
description = "轻量、零侵入的 LLM 推理引擎请求级监控(支持 vLLM 和 SGLang,对齐点评美团 CAT 的四种指标模型)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "apple" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "psutil>=5.9",
]

[project.optional-dependencies]
nvidia = ["pynvml>=11.5"]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0.0",
    "httpx>=0.27",
]

[project.scripts]
llm-monitor = "llm_monitor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_monitor"]

[tool.hatch.build.targets.wheel.force-include]
# pip 安装 wheel 时,purelib 根目录的 .pth 会自动放入 site-packages
# 这样 pip install llm-monitor 后就不需要任何额外步骤
"llm_monitor_autoload.pth" = "llm_monitor_autoload.pth"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
